spring:
  application:
    name: CreaterStore

  # DB info
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/store_db}
    username: ${SPRING_DATASOURCE_USERNAME:store_user}
    password: ${SPRING_DATASOURCE_PASSWORD:store_password}

  # ORM - Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format-sql: true