server:
  port: 9000

spring:
  application:
    name: urlshortener

  # Virtual threads (Project Loom, stable since Java 21) — every request is
  # handled on a lightweight virtual thread instead of a pooled platform
  # thread. For an I/O-bound service like this (mostly waiting on Postgres
  # and Redis), this is the single biggest concurrency upgrade over the
  # Node event loop, and it's a one-line opt-in.
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:url}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    # Flyway owns the schema; Hibernate must never try to auto-generate or
    # alter tables itself in any environment you care about.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis

app:
  base-url: ${APP_BASE_URL:http://localhost:9000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    dev.singularity.urlshortener: INFO
    org.hibernate.SQL: WARN
